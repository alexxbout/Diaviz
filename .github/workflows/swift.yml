# Diaviz is an Xcode project (.xcodeproj), not a Swift Package — there is no
# Package.swift, so `swift build`/`swift test` always fail here. Build and
# test via xcodebuild against the iOS Simulator instead.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # iOS 26 deployment target requires the Xcode 26 SDK, only on macos-26+.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - name: Select an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -m1 -oE '^\s*iPhone [^(]+' | sed -E 's/^\s+|\s+$//g')
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild -project Diaviz.xcodeproj -scheme Diaviz \
            -destination "generic/platform=iOS Simulator" \
            build

      # TestFlight builde en Release : sans cette étape, une régression qui ne
      # casse que la configuration Release (typiquement du code debug-only
      # référencé hors #if DEBUG) passe inaperçue jusqu'à l'upload.
      - name: Build (Release)
        run: |
          xcodebuild -project Diaviz.xcodeproj -scheme Diaviz \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            build

      - name: Test
        run: |
          xcodebuild -project Diaviz.xcodeproj -scheme Diaviz \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            test
