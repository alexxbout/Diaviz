# Diaviz is an Xcode project (.xcodeproj), not a Swift Package — there is no
# Package.swift, so `swift build`/`swift test` always fail here. Build and
# test via xcodebuild against the iOS Simulator instead.

name: Swift

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    # iOS 26 deployment target requires the Xcode 26 SDK, only on macos-26+.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      # Xcode 26 ne livre plus le compilateur Metal par défaut : sans ce
      # composant, la compilation de Grain.metal échoue (« cannot execute tool
      # 'metal' »). Le cache du runner le contient parfois déjà, d'où le test
      # préalable plutôt qu'un téléchargement systématique de ~700 Mo.
      - name: Metal toolchain
        run: |
          if ! xcrun -f metal >/dev/null 2>&1; then
            xcodebuild -downloadComponent MetalToolchain
          else
            echo "Metal toolchain déjà présente."
          fi

      - name: Select an available iPhone simulator
        id: sim
        run: |
          NAME=$(xcrun simctl list devices available | grep -m1 -oE '^[[:space:]]*iPhone [^(]+' | sed -E 's/^[[:space:]]+|[[:space:]]+$//g')
          echo "Using simulator: $NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Build
        run: |
          xcodebuild -project Diaviz.xcodeproj -scheme Diaviz \
            -destination "generic/platform=iOS Simulator" \
            build

      # TestFlight builde en Release : sans cette étape, une régression qui ne
      # casse que la configuration Release (typiquement du code debug-only
      # référencé hors #if DEBUG) passe inaperçue jusqu'à l'upload.
      - name: Build (Release)
        run: |
          xcodebuild -project Diaviz.xcodeproj -scheme Diaviz \
            -destination "generic/platform=iOS Simulator" \
            -configuration Release \
            build

      - name: Test
        run: |
          xcodebuild -project Diaviz.xcodeproj -scheme Diaviz \
            -destination "platform=iOS Simulator,name=${{ steps.sim.outputs.name }}" \
            test
